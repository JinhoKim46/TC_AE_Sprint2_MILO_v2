# MILO v2 service-area catalogue (fictional). Source of truth for area ids, scope, effect inputs and the blueprints each
# area was derived from (B01 to B20, by number). The solution articles and the intake harness must agree with it
# (tests/test_data.py). No prices: the onboarding bot states scope and effect ranges, never money.
version: catalogue-v3-2026-10
modules:
  - id: request-dispatch
    name: Request and dispatch management
    blueprints: ["01", "02", "08", "16", "19"]
    summary: Collects requests from several channels into one queue, shows who accepted each request, flags likely duplicates, and suggests dispatch changes with the dispatcher deciding.
    includes: [one shared request queue, capture from calls and messages, duplicate hints, acceptance owner per request, dispatch suggestions with access windows and skills]
    excludes: [merging requests without a coordinator decision, automatic reassignment without the dispatcher, a mandatory customer portal]
    integrations: [spreadsheet-import, service-software-api]
    effect_inputs:
      events: requests_per_week
      baseline_minutes: minutes_to_assign
      new_minutes: {assumed: 4, note: minutes of staff time per request with one shared queue}
  - id: consumables-stock
    name: Consumables and stock management
    blueprints: ["04", "18"]
    summary: Shows where consumables, parts and loan devices are (store, vehicle or customer site), which items are compatible with which devices, and which items need serial and warranty tracking.
    includes: [stock by location, device-to-consumable compatibility, customer-held stock, serialized and warranty items, reorder reminders for cheap items]
    excludes: [automatic purchase orders, supplier negotiation]
    integrations: [spreadsheet-import, service-software-api]
    effect_inputs:
      events: searches_per_week
      baseline_minutes: minutes_per_search
      new_minutes: {assumed: 3, note: minutes per search with a location list}
  - id: usage-billing-prep
    name: Usage and billing preparation
    blueprints: ["05", "06", "11", "13", "14"]
    summary: Turns meter and usage readings into checked figures, checks them against device history and agreement terms, and holds questionable readings in an exception queue before billing is prepared.
    includes: [reading capture with a reference, counter-order checks, usage calculation per agreement, exception queue, coverage check before work]
    excludes: [sending invoices without review, setting customer terms, legal contract review]
    integrations: [spreadsheet-import, accounting-export]
    effect_inputs:
      events: readings_per_month
      baseline_minutes: minutes_per_reading
      new_minutes: {assumed: 1.5, note: minutes per reading with the checks}
  - id: operations-overview
    name: Operations overview
    blueprints: ["03", "07", "09", "10", "12", "15", "17", "20"]
    summary: One board of open work with an owner and a next action for each item, the blockers that stop it, and a record of commitments that does not depend on one person's memory.
    includes: [open work board, owner and next action per item, blocker states, commitment log, reviewed fix notes]
    excludes: [closing work without a person, reporting figures not entered by staff, diagnosing faults]
    integrations: [spreadsheet-import, email-capture, service-software-api]
    effect_inputs:
      events: status_questions_per_week
      baseline_minutes: minutes_per_status_question
      new_minutes: {assumed: 2, note: minutes per status question with the board}
later_areas:
  - id: process-linking
    name: Linking processes across tools
    note: Named for the owner; not diagnosed in this project.
  - id: structured-intake
    name: Turning unstructured inputs into one structured record
    note: Named for the owner; not diagnosed in this project.
integrations:
  - id: spreadsheet-import
    name: Spreadsheet import
    notes: The business keeps the data in spreadsheets; files are imported and exported as CSV. No live connection.
  - id: email-capture
    name: Email capture
    notes: A shared mailbox is read with the business's permission.
  - id: service-software-api
    name: Service software API
    notes: The business's service management application offers an API with an access key.
  - id: accounting-export
    name: Accounting export
    notes: Prepared figures are exported as a file for the accounts team to import.
