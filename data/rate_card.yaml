# MILO v2 rate card (fictional figures). The estimate tool computes prices from this file in code; the model never
# supplies a number. The pricing articles in data/kb/pricing/ must state the same figures (tests/test_data.py).
version: rate-card-v2-2026-10
currency: USD
base_monthly:
  request-intake: 420
  dispatch-planning: 560
  contract-management: 480
  stock-control: 390
  meter-billing: 450
  service-reports: 340
  work-tracking: 360
setup_fee_per_module: 1200
integration_surcharge_monthly:
  spreadsheet-import: 0
  email-capture: 150
  service-software-api: 300
  accounting-export: 100
# Factor by the number of field technicians; above the last tier a person prices the work.
technician_tiers:
  - {max_technicians: 5, factor: 1.00}
  - {max_technicians: 15, factor: 1.30}
  - {max_technicians: 30, factor: 1.60}
range_factors: {low: 0.90, base: 1.00, high: 1.20}
max_modules: 7
