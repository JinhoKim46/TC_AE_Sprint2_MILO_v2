# DRAFT for M0b. Not loaded by the app or the tests yet. Fictional service areas only.
# Replaces the seven modules in data/catalogue.yaml once approved.
# effect_inputs names the intake-harness slot (docs/design/intake-harness-draft.yaml) that supplies each value.
# If the owner gives no value, the "assumed" value is used and the answer says so.
# Range: central value from the owner (or the assumption), low = 0.8 x central, high = 1.2 x central, unless the owner gives a range.
version: catalogue-v3-draft
areas:
  - id: request-dispatch
    name: Request and dispatch management
    summary: Collects requests from several channels into one queue, shows who accepted each request, and flags likely duplicates.
    includes: [one shared request queue, capture from calls and messages, duplicate hints, acceptance owner per request]
    excludes: [merging requests without a coordinator decision, a mandatory customer portal]
    effect_inputs:
      events: requests_per_week            # owner-reported
      baseline_minutes: minutes_to_assign  # owner-reported staff minutes per request; assumed 12
      new_minutes: 4                       # assumed: minutes per request with one shared queue
  - id: consumables-stock
    name: Consumables and stock management
    summary: Shows where consumables and parts are (store, vehicle or customer site) and when a reorder is due.
    includes: [stock by location, device-to-consumable compatibility, low-stock reminders]
    excludes: [automatic purchase orders, supplier price negotiation]
    effect_inputs:
      events: searches_per_week             # owner-reported
      baseline_minutes: minutes_per_search  # owner-reported; assumed 15
      new_minutes: 3                        # assumed: minutes per search with a location list
  - id: usage-billing-prep
    name: Usage and billing preparation
    summary: Turns meter or usage readings into checked, billable figures, with an exception list for readings that do not fit the history.
    includes: [reading capture with a reference, counter-order checks, usage calculation per agreement, exception queue]
    excludes: [sending invoices without review, setting customer prices]
    effect_inputs:
      events: readings_per_month            # owner-reported
      baseline_minutes: minutes_per_reading # owner-reported; assumed 6
      new_minutes: 1.5                      # assumed: minutes per reading with the checks
  - id: operations-overview
    name: Operations overview
    summary: One board of open work with an owner and a next action for each item, and the blockers that stop it.
    includes: [open work board, owner and next action per item, blocker states]
    excludes: [closing work without a person, reporting figures not entered by staff]
    effect_inputs:
      events: status_questions_per_week           # owner-reported
      baseline_minutes: minutes_per_status_question # owner-reported; assumed 10
      new_minutes: 2                              # assumed: minutes per status question with the board
later_areas:
  - id: process-linking
    name: Linking processes across tools
    note: Named for the owner; not diagnosed in this project.
  - id: structured-intake
    name: Turning unstructured inputs into one structured record
    note: Named for the owner; not diagnosed in this project.
