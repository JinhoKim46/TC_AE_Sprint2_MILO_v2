<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #ask-chat {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .ask-top {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 40px;
      border-bottom: 2px solid var(--color-line);
      font-size: var(--t-caption);
      font-weight: 700;
    }
    .ask-top img {
      width: 44px;
      height: 44px;
    }
    .ask-thread {
      flex: 1;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: var(--color-ground);
    }
    #ask-you {
      max-width: 1080px;
      background: var(--color-accent);
      color: #ffffff;
      padding: 22px 30px;
      border-radius: 30px 30px 8px 30px;
    }
    .ask-composer {
      display: flex;
      gap: 20px;
      align-items: stretch;
      padding: 28px 40px;
      border-top: 2px solid var(--color-line);
    }
    .ask-box {
      position: relative;
      flex: 1;
      min-height: 112px;
      background: var(--color-ground);
      border: 2px solid var(--color-accent);
      border-radius: 22px;
      padding: 18px 24px;
    }
    #ask-placeholder {
      position: absolute;
      left: 24px;
      top: 18px;
      right: 24px;
    }
    #ask-send {
      align-self: flex-end;
      background: var(--color-accent);
      color: #ffffff;
      font-size: var(--t-body);
      font-weight: 600;
      padding: 20px 36px;
      border-radius: 18px;
    }
  </style>
  <div id="root" data-composition-id="ask" data-width="1920" data-height="1080">
    <div id="ask-stage" class="g-stage">
      <div id="ask-eyebrow" class="g-eyebrow">Sample exchange</div>
      <div id="ask-title" class="g-title">The owner describes one kind of work.</div>
      <div id="ask-chat" class="g-content g-card">
        <div class="ask-top"><img src="assets/milo-mark.svg" alt="" /><span>Diagnosis chat</span></div>
        <div class="ask-thread">
          <div id="ask-you" class="g-body">We get about 40 service requests a week, and each takes about 12 minutes to assign. What could a shared queue save us?</div>
        </div>
        <div class="ask-composer">
          <div class="ask-box g-body">
            <div id="ask-placeholder" class="g-muted">Describe one kind of work in your business, or ask a question</div>
            <div id="ask-typed">We get about 40 service requests a week, and each takes about 12 minutes to assign. What could a shared queue save us?</div>
          </div>
          <div id="ask-send">Send</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      // Split the typed message into characters once, at build time (deterministic).
      const typed = document.getElementById("ask-typed");
      const text = typed.textContent;
      typed.textContent = "";
      for (const ch of text) {
        const s = document.createElement("span");
        s.className = "ask-ch";
        s.textContent = ch;
        typed.appendChild(s);
      }

      const tl = gsap.timeline({ paused: true });
      const IN = { duration: 0.7, ease: "power3.out" };
      tl.fromTo("#ask-stage", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 0);
      tl.fromTo(["#ask-eyebrow", "#ask-title"], { opacity: 0, y: 24 }, { opacity: 1, y: 0, ...IN, stagger: 0.12 }, 0.4);
      tl.fromTo("#ask-you", { opacity: 0, y: 24 }, { opacity: 0, y: 24, duration: 0.01 }, 0);
      // Typing: 0.022 s per character, from 1.0 s to about 3.6 s.
      tl.fromTo("#ask-placeholder", { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none", immediateRender: false }, 1.0);
      tl.fromTo(".ask-ch", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.022, ease: "none" }, 1.0);
      // Send pressed at 3.8 s: the button dips without overshoot.
      tl.fromTo("#ask-send", { opacity: 1 }, { opacity: 0.7, duration: 0.1, ease: "power2.in" }, 3.8);
      tl.fromTo("#ask-send", { opacity: 0.7 }, { opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.9);
      tl.fromTo("#ask-typed", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, 3.85);
      tl.fromTo("#ask-placeholder", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 4.1);
      // The owner's message lands in the thread.
      tl.fromTo("#ask-you", { opacity: 0, y: 24 }, { opacity: 1, y: 0, ...IN, immediateRender: false }, 3.9);
      window.__timelines["ask"] = tl;
    })();
  </script>
</template>
