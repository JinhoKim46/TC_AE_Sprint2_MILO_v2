<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Milo, the MILO mascot, waving">
  <ellipse cx="100" cy="206" rx="54" ry="8" fill="#1D1C19" opacity=".12"/>
  <!-- body: a soft pebble shape -->
  <path d="M100 52 C146 52 164 88 162 132 C160 174 134 196 100 196 C66 196 40 174 38 132 C36 88 54 52 100 52 Z" fill="#2C6B5C"/>
  <!-- belly plate -->
  <path d="M74 150 Q100 166 126 150 Q126 178 100 184 Q74 178 74 150 Z" fill="#E6F0EC"/>
  <!-- head: a white visor with two eyes -->
  <rect x="58" y="72" width="84" height="58" rx="26" fill="#FFFFFF"/>
  <circle cx="82" cy="100" r="8" fill="#1D1C19"/>
  <circle cx="118" cy="100" r="8" fill="#1D1C19"/>
  <circle cx="85" cy="97" r="2.6" fill="#FFFFFF"/>
  <circle cx="121" cy="97" r="2.6" fill="#FFFFFF"/>
  <path d="M86 116 Q100 126 114 116" fill="none" stroke="#1D1C19" stroke-width="3" stroke-linecap="round"/>
  <!-- antenna -->
  <line x1="100" y1="72" x2="100" y2="54" stroke="#2C6B5C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="48" r="7" fill="#E3B56B"/>
  <!-- left arm down, right arm waving -->
  <path d="M42 150 Q26 160 30 178" fill="none" stroke="#2C6B5C" stroke-width="13" stroke-linecap="round"/>
  <path d="M158 140 Q180 112 172 84" fill="none" stroke="#2C6B5C" stroke-width="13" stroke-linecap="round"/>
  <circle cx="172" cy="78" r="9" fill="#2C6B5C"/>
  <!-- the document Milo carries: passages with citations -->
  <rect x="22" y="112" width="30" height="38" rx="4" fill="#FFFFFF" stroke="#2C6B5C" stroke-width="3"/>
  <g stroke="#2C6B5C" stroke-width="2.5" stroke-linecap="round"><line x1="28" y1="124" x2="46" y2="124"/><line x1="28" y1="132" x2="46" y2="132"/><line x1="28" y1="140" x2="40" y2="140"/></g>
</svg>
