.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

tr.pick:hover td { background: var(--surface-2); }

.finding.sev-high { border-left-color: var(--bad); } .finding.sev-medium { border-left-color: var(--amber); } .finding.sev-low { border-left-color: var(--l0); } .finding.sev-info { border-left-color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* fade: when something is selected, everything not connected to it steps back */
.fadeable { transition: opacity 0.18s ease; }
.focus .fadeable.dim { opacity: var(--fade, 0.22); }
.focus .medge.dim, .focus .e.dim { stroke-opacity: 0.05; }
.medge.bg { stroke: var(--muted); stroke-opacity: 0.10; stroke-width: 1; }
.focus .medge.bg { stroke-opacity: 0.03; }
.medge.hl, .e.hl { stroke-opacity: 1 !important; stroke-width: 2.4 !important; }
.fadebar { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.fadebar input[type=range] { width: 120px; accent-color: var(--accent); }
.todo { color: var(--amber); font-style: italic; }

ral Chroma collection with cosine distance and adds one entry per chunk: id, vector, text and metadata (doc_id, section, product).","doc":"","file":"src/milo/index.py","line":12,"params":[],"receives":"chunks, vectors (one per chunk, else ValueError)","returns":"Index ready for search","stores":"in-memory Chroma collection, lost on restart","symbol":"milo.index:Index"},{"action":"Wraps the App in a Flask app with the session secret from MILO_SECRET_KEY (or a random one) and registers the page and API routes.","doc":"","file":"src/milo/web.py","line":27,"params":["milo_app","secret_key"],"receives":"App, optional secret key","returns":"Flask app, run on 127.0.0.1:5000","stores":"nothing","symbol":"milo.web:create_app"}],"summary":"build_web picks the store, the embedder and the chat models from the environment, loads every knowledge-base article, chunks and embeds it, and puts the vectors in an in-memory Chroma index. It then wraps the app in the Flask routes and serves on 127.0.0.1:5000.","title":"Start the app and build the index","trigger":"uv run python -m milo.serve"},{"actor":"chat model (inside a question)","id":"tool-call-effect","steps":[{"action":"Checks the arguments against the estimate_effect spec (area_id must be a catalogue module); the tool's risk is read, so it runs at once with the session's owner id, never an id the model wrote.","actor":"milo.app:App._ask (tool loop)","doc":"","file":"src/milo/app.py","line":310,"params":["self","name","args","specs","user_id"],"payload":"{\"name\": \"estimate_effect\", \"args\": {\"area_id\": \"request-dispatch\"}}\n\n","receives":"name 'estimate_effect', args {area_id}, specs, user_id","returns":"(ToolResult(output, ok = true, decision 'allowed'), 'allowed'); a ValueError, KeyError or TypeError becomes an error output for the model","stores":"nothing","symbol":"milo.app:App._run_tool"},{"action":"Looks up the handler method named _<tool name> and calls it with the arguments and the owner id.","doc":"","file":"sr ,"steps":[{"action":"Parses --embedder, --max-cost, --split and --replay; a replay only recomputes metrics from a stored file, otherwise it runs the evaluation, writes the result and replays it.","actor":"developer (CLI)","doc":"","file":"scripts/eval_retrieval.py","line":149,"params":[],"receives":"command-line arguments","returns":"exit code (1 on a replay mismatch)","stores":"evals/results/retrieval/<split>_<embedder>.json","symbol":"scripts.eval_retrieval:main"},{"action":"Builds the embedder (gemini through OpenRouter needs MILO_LIVE=1 and is capped by --max-cost; lexical is free), chunks the knowledge base and builds the Index.","doc":"","file":"scripts/eval_retrieval.py","line":92,"params":["embedder_name","max_cost","split"],"receives":"embedder name, max cost, split","returns":"result dict: embedder, chunk settings, chunk_count, metrics, rows","stores":"nothing itself","symbol":"scripts.eval_retrieval:run"},{"action":"Reads data/gold.jsonl and keeps the rows of the split that have gold evidence; the test split is logged on every read and a second read is refused unless MILO_TEST_REREAD=1.","doc":"The rows of one split. The test split is read once: every read is logged, and a second read is refused.","file":"scripts/eval_retrieval.py","line":52,"params":["split"],"payload":"{\"qid\": \"d07\", \"split\": \"dev\", \"type\": \"case\", \"question\": \"How did a print shop cut double ticket entry?\", \"gold_evidence\": [{\"quote\": \"tickets were typed twice\"}]}\n\n","receives":"split name","returns":"list of gold rows {qid, type, question, gold_evidence}","stores":"evals/results/test_access.log (test split only)","symbol":"scripts.eval_retrieval:split_rows"},{"action":"For each embedded question, returns the top 5 chunks; run records the position of the first chunk whose normalised text contains a gold quote.","doc":"Top-k as (chunk_id, text, score), best first. Score = 1 - cosine distance. `where` filters on metadata.","file":"src/milo/index.py","line":30,"par ervice business from a knowledge base of past cases and service areas. Each question passes through retrieval, a model call with an optional tool loop, and a store, and every step is written to a trace.","title":"MILO v2"},"modules":{"milo":{"call_sites":0,"cli":false,"doc":"","exports":[],"file":"src/milo/__init__.py","funcs":[],"imports":[],"layer":"milo","lazy_imports":[],"lines":0,"note":{"does":"Holds no code and no state; it only gives the package its name.","flow":"Imported implicitly whenever any milo.* module is loaded (milo.serve, the scripts.* evaluation runners, the tests). It reads and writes nothing.","purpose":"Marks src/milo as an importable Python package, so the other modules can import each other as milo.*."},"packages":[],"unresolved":0},"milo.advanced":{"call_sites":41,"cli":false,"doc":"M2 advanced retrieval: one query translation and a schema-validated self-query with a safe fallback.","exports":[],"file":"src/milo/advanced.py","funcs":["milo.advanced:_tokens","milo.advanced:retrieve","milo.advanced:self_query","milo.advanced:translate_keywords","milo.advanced:validate_filters"],"imports":[],"layer":"milo","lazy_imports":[],"lines":141,"note":{"does":"Rewrites a question into search words by dropping question words and adding area vocabulary (translate_keywords). Guesses the product area and section a question points to and returns them as filters (self_query). Rejects any filter outside a fixed schema (validate_filters). Searches with the filter and falls back to an unfiltered search if the filter is missing, invalid or finds nothing (retrieve).","flow":"Called only by the evaluation scripts (scripts.eval_advanced), not by the web app. self_query/translate_keywords produce the filter or rewritten query, then retrieve passes the question vector to milo.index.Index.search with a where clause and repeats without it when there are no hits. Writes nothing.","note":"The fallback is deliberate: a wrong or empty filter must never leave the user with ved to the thread history. Fallback calls never offer tools in practice because LocalOllamaChat ignores them.","purpose":"The core of MILO: it turns one user question into a grounded, cited answer, and without it there is no chatbot."},"packages":["__future__","datetime","hashlib","json","pathlib","re","time","typing"],"unresolved":8},"milo.chunk":{"call_sites":47,"cli":false,"doc":"Heading-aware chunking of the knowledge-base articles.","exports":[],"file":"src/milo/chunk.py","funcs":["milo.chunk:Chunk","milo.chunk:_cut","milo.chunk:_sections","milo.chunk:chunk_article","milo.chunk:chunk_body","milo.chunk:chunk_section","milo.chunk:front_matter"],"imports":[],"layer":"milo","lazy_imports":[],"lines":123,"note":{"does":"Splits the front matter (title, section, product) from the article body. Starts a new chunk at every heading. Packs whole paragraphs into chunks of up to 800 characters and cuts only over-long paragraphs, at sentence ends with a 100-character overlap.","flow":"milo.serve.load_documents calls front_matter for each .md file under data/kb; milo.app.App.ingest calls chunk_body per document; scripts.eval_retrieval calls it for the evaluation. The resulting Chunk records (id like doc#000) go to milo.embed for vectors and then into milo.index.Index. Writes nothing itself.","note":"A chunk never crosses a heading, and a paragraph that fits is never cut, so a quoted gold sentence lands whole in one chunk. An article without front matter raises ValueError.","purpose":"Cuts knowledge-base articles into passages small enough to embed and cite, keeping each passage tied to its document, section and product."},"packages":["__future__","dataclasses","itertools","re"],"unresolved":6},"milo.embed":{"call_sites":22,"cli":false,"doc":"Embedders: the same interface for an offline baseline and for the chosen live model.","exports":[],"file":"src/milo/embed.py","funcs":["milo.embed:Embedder","milo.embed:Embedder.embed","milo.embed:LexicalEmbedder","milo.embed:LexicalEmbed
