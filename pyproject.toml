[project]
name = "milo-v2"
version = "0.1.0"
description = "A RAG diagnosis chatbot for IT-maintenance businesses, built milestone by milestone"
requires-python = ">=3.12"
dependencies = [
    "langchain-core==1.6.13",
    "langchain-openai==1.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milo"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-socket==0.8.1",
    "ruff==0.17.1",
]

[tool.ruff]
extend-exclude = ["contract", "scripts/check_project_data.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket"
